# 本地开发用：MySQL（必须）；Redis 当前版本未使用，如需要可取消注释

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      # 请修改为你的密码，并同步到 .env 的 MYSQL_PASSWORD
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请先在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: peizhen
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行（按文件名顺序：schema → seed-compliance → seed）
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./database/seed-compliance.sql:/docker-entrypoint-initdb.d/seed-compliance.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  # redis:
  #   image: redis:7
  #   restart: always
  #   ports:
  #     - "6379:6379"

volumes:
  mysql-data:
